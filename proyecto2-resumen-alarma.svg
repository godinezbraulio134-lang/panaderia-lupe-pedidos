<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="1100" height="800" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Resumen semanal y alarma de errores del Proyecto 2</title>
  <desc>Cada sábado a las 6 de la tarde, EventBridge Scheduler activa una Lambda que lee los pedidos de DynamoDB, arma el resumen de la semana y lo publica en un tema de SNS que envía el correo a Lupe. Aparte, una alarma de CloudWatch vigila los errores de la Lambda de pedidos y avisa por otro tema de SNS al desarrollador.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1100" height="800" fill="#0f172a"/>

  <!-- Grupos -->
  <rect x="230" y="60" width="650" height="290" rx="10" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="246" y="84" font-size="13" fill="#7dd3fc">AWS · Resumen semanal</text>
  <rect x="230" y="395" width="650" height="170" rx="10" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="246" y="419" font-size="13" fill="#7dd3fc">AWS · Alarma de errores</text>

  <!-- Líneas -->
  <g fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)">
    <path d="M380 150 H470"/>
    <path d="M530 185 V250"/>
    <path d="M590 150 H700"/>
    <path d="M820 150 H950"/>
    <path d="M380 490 H470"/>
    <path d="M590 490 H700"/>
    <path d="M820 490 H950"/>
  </g>

  <!-- Resumen semanal -->
  <rect x="260" y="115" width="120" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <rect x="260" y="115" width="120" height="6" rx="3" fill="#f472b6"/>
  <text x="320" y="149" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">Scheduler</text>
  <text x="320" y="167" font-size="11" fill="#94a3b8" text-anchor="middle">sábados, 6 p. m.</text>

  <rect x="470" y="115" width="120" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <rect x="470" y="115" width="120" height="6" rx="3" fill="#fb923c"/>
  <text x="530" y="149" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">Lambda</text>
  <text x="530" y="167" font-size="11" fill="#94a3b8" text-anchor="middle">arma el resumen</text>

  <rect x="470" y="250" width="120" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <rect x="470" y="250" width="120" height="6" rx="3" fill="#60a5fa"/>
  <text x="530" y="284" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">DynamoDB</text>
  <text x="530" y="302" font-size="11" fill="#94a3b8" text-anchor="middle">tabla de pedidos</text>

  <rect x="700" y="115" width="120" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <rect x="700" y="115" width="120" height="6" rx="3" fill="#f43f5e"/>
  <text x="760" y="149" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">SNS</text>
  <text x="760" y="167" font-size="11" fill="#94a3b8" text-anchor="middle">tema del resumen</text>

  <rect x="950" y="115" width="120" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <rect x="950" y="115" width="120" height="6" rx="3" fill="#94a3b8"/>
  <text x="1010" y="149" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">Lupe</text>
  <text x="1010" y="167" font-size="11" fill="#94a3b8" text-anchor="middle">recibe el resumen</text>

  <!-- Alarma -->
  <rect x="260" y="455" width="120" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <rect x="260" y="455" width="120" height="6" rx="3" fill="#fb923c"/>
  <text x="320" y="489" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">Lambda</text>
  <text x="320" y="507" font-size="11" fill="#94a3b8" text-anchor="middle">la de pedidos</text>

  <rect x="470" y="455" width="120" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <rect x="470" y="455" width="120" height="6" rx="3" fill="#f59e0b"/>
  <text x="530" y="489" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">CloudWatch</text>
  <text x="530" y="507" font-size="11" fill="#94a3b8" text-anchor="middle">alarma de errores</text>

  <rect x="700" y="455" width="120" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <rect x="700" y="455" width="120" height="6" rx="3" fill="#f43f5e"/>
  <text x="760" y="489" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">SNS</text>
  <text x="760" y="507" font-size="11" fill="#94a3b8" text-anchor="middle">tema de errores</text>

  <rect x="950" y="455" width="120" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <rect x="950" y="455" width="120" height="6" rx="3" fill="#94a3b8"/>
  <text x="1010" y="489" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">Desarrollador</text>
  <text x="1010" y="507" font-size="11" fill="#94a3b8" text-anchor="middle">recibe el aviso</text>

  <!-- Insignias -->
  <g fill="#2563eb">
    <circle cx="425" cy="150" r="11"/>
    <circle cx="530" cy="218" r="11"/>
    <circle cx="645" cy="150" r="11"/>
    <circle cx="915" cy="150" r="11"/>
  </g>
  <g fill="#f59e0b">
    <circle cx="425" cy="490" r="11"/>
    <circle cx="645" cy="490" r="11"/>
    <circle cx="915" cy="490" r="11"/>
  </g>
  <g font-size="12" font-weight="700" fill="#fff" text-anchor="middle">
    <text x="425" y="154">1</text>
    <text x="530" y="222">2</text>
    <text x="645" y="154">3</text>
    <text x="915" y="154">4</text>
  </g>
  <g font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">
    <text x="425" y="494">5</text>
    <text x="645" y="494">6</text>
    <text x="915" y="494">7</text>
  </g>

  <!-- Leyenda -->
  <rect x="30" y="595" width="1040" height="185" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="48" y="620" font-size="14" font-weight="700" fill="#e2e8f0">Pasos</text>
  <g font-size="12.5" fill="#cbd5e1">
    <text x="48" y="646"><tspan font-weight="700" fill="#60a5fa">1</tspan>  Scheduler activa la Lambda cada sábado a las 6 p. m., hora de México</text>
    <text x="48" y="664"><tspan font-weight="700" fill="#60a5fa">2</tspan>  La Lambda lee la tabla (Scan) y se queda con los 7 días que empiezan mañana</text>
    <text x="48" y="682"><tspan font-weight="700" fill="#60a5fa">3</tspan>  Publica el resumen ordenado por día en SNS (si no hay pedidos, un aviso de “sin pedidos”)</text>
    <text x="48" y="700"><tspan font-weight="700" fill="#60a5fa">4</tspan>  SNS envía el correo a Lupe</text>
    <text x="48" y="722"><tspan font-weight="700" fill="#f59e0b">5</tspan>  La Lambda de pedidos envía sus métricas a CloudWatch, entre ellas los errores</text>
    <text x="48" y="740"><tspan font-weight="700" fill="#f59e0b">6</tspan>  Si hay 1 error o más en un periodo de 6 horas, la alarma publica en un tema de SNS aparte</text>
    <text x="48" y="758"><tspan font-weight="700" fill="#f59e0b">7</tspan>  SNS envía el correo al desarrollador, y no a Lupe</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
